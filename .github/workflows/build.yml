name: Build Glass Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '14.x'
    
    - name: Install dependencies
      run: npm install
    
    - name: Install electron-packager
      run: npm install -g electron-packager
    
    - name: Build application
      run: electron-packager . "Glass Browser" --platform=win32 --arch=x64 --icon=assets/icon.ico --out=dist
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: glass-browser
        path: dist/